services:
  cookdex:
    image: ${COOKDEX_IMAGE:-ghcr.io/thekannen/cookdex}:${COOKDEX_TAG:-latest}
    container_name: cookdex
    restart: unless-stopped
    user: "0:0"
    env_file:
      - path: .env
        required: false
    environment:
      WEB_BIND_PORT: ${WEB_BIND_PORT:-4820}
    volumes:
      - ./cache:/app/cache
      - ./logs:/app/logs
      - ./reports:/app/reports
      # Only if CookDex reaches Mealie's database over SSH (Settings -> Faster database access):
      # - ~/.ssh/cookdex_mealie:/app/.ssh/cookdex_mealie:ro
    ports:
      - "${WEB_BIND_PORT:-4820}:${WEB_BIND_PORT:-4820}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
